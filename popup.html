<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 240px;
        margin: 0;
        padding: 14px 16px;
        background: #141414;
        color: #fff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        color: #e50914;
        letter-spacing: 0.3px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        padding: 8px 0;
        cursor: pointer;
      }
      input {
        width: 18px;
        height: 18px;
        accent-color: #e50914;
        cursor: pointer;
      }
      .hint {
        font-size: 11px;
        color: #8c8c8c;
        margin-top: 10px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Netflix Auto Pause/Resume</h1>
    <label>Enabled <input type="checkbox" id="enabled" /></label>
    <label>Auto-resume when I return <input type="checkbox" id="autoResume" /></label>
    <div class="hint">
      Pauses when you switch app, desktop/Space, tab, or lock the screen. Only
      resumes what it paused. Reload the Netflix tab after changing settings.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
